<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Career timeline 2008 to present">
  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#2563eb" stop-opacity="0.25"/>
      <stop offset="22%"  stop-color="#2563eb"/>
      <stop offset="42%"  stop-color="#9333ea"/>
      <stop offset="62%"  stop-color="#0891b2"/>
      <stop offset="80%"  stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="nowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="cardShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="nowGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Paper background -->
  <rect width="1200" height="540" fill="url(#paper)"/>
  <!-- Top accent stripe -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#flow)"/>

  <!-- Title -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
    <text x="60" y="56" font-size="22" font-weight="700" fill="#0f172a" letter-spacing="2">CAREER  JOURNEY</text>
    <text x="60" y="80" font-size="13" fill="#475569">18+ years &#8226; software engineering &#8594; cloud architecture &#8594; AI-led modernization</text>
    <line x1="60" y1="92" x2="220" y2="92" stroke="#2563eb" stroke-width="2"/>
  </g>

  <!-- 5 EQUAL-WIDTH MILESTONE COLUMNS -->
  <!-- Centers: 168, 384, 600, 816, 1032  (column width: 216) -->

  <!-- Period labels (above) -->
  <g font-family="-apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">
    <text x="168"  y="140" fill="#2563eb">2008  &#8211;  2014</text>
    <text x="384"  y="140" fill="#9333ea">2014  &#8211;  2017</text>
    <text x="600"  y="140" fill="#0891b2">2017  &#8211;  2024  &#8226;  7 YEARS</text>
    <text x="816"  y="140" fill="#ea580c">2024  &#8211;  2026</text>
    <text x="1032" y="140" fill="#16a34a">MAY 2026  &#8211;  NOW</text>
  </g>

  <!-- Chapter labels (small caps, above circles) -->
  <g font-family="-apple-system, sans-serif" font-size="9" fill="#64748b" text-anchor="middle" letter-spacing="2" font-weight="600">
    <text x="168"  y="160">FOUNDATION</text>
    <text x="384"  y="160">ATOS  &#8226;  ARCHITECT</text>
    <text x="600"  y="160">EVIDEN  &#8226;  ACCOUNT  CTO</text>
    <text x="816"  y="160">ATOS  &#8226;  DEPUTY  CMO</text>
    <text x="1032" y="160">PRINCIPAL  CLOUD  ARCH.</text>
  </g>

  <!-- Tick marks down to the line -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 3">
    <line x1="168"  y1="170" x2="168"  y2="194"/>
    <line x1="384"  y1="170" x2="384"  y2="194"/>
    <line x1="600"  y1="170" x2="600"  y2="194"/>
    <line x1="816"  y1="170" x2="816"  y2="194"/>
    <line x1="1032" y1="170" x2="1032" y2="194"/>
  </g>

  <!-- Horizontal flow line (gradient) -->
  <line x1="60" y1="208" x2="1140" y2="208" stroke="url(#flow)" stroke-width="3" stroke-linecap="round"/>

  <!-- Directional chevrons between milestones -->
  <g fill="#cbd5e1">
    <path d="M 270 204 l 6 4 l -6 4 z"/>
    <path d="M 486 204 l 6 4 l -6 4 z"/>
    <path d="M 702 204 l 6 4 l -6 4 z"/>
    <path d="M 918 204 l 6 4 l -6 4 z"/>
  </g>

  <!-- Milestone circles -->
  <g filter="url(#cardShadow)">
    <circle cx="168"  cy="208" r="11" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <circle cx="384"  cy="208" r="11" fill="#ffffff" stroke="#9333ea" stroke-width="3"/>
    <circle cx="600"  cy="208" r="13" fill="#ffffff" stroke="#0891b2" stroke-width="3"/>
    <circle cx="816"  cy="208" r="11" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
  </g>

  <!-- NOW: highlighted with halo + glow -->
  <circle cx="1032" cy="208" r="22" fill="url(#nowGrad)" opacity="0.18" filter="url(#nowGlow)"/>
  <circle cx="1032" cy="208" r="14" fill="#ffffff" stroke="url(#nowGrad)" stroke-width="3"/>
  <circle cx="1032" cy="208" r="5"  fill="#16a34a"/>

  <!-- Tick marks down to detail cards -->
  <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 3">
    <line x1="168"  y1="222" x2="168"  y2="246"/>
    <line x1="384"  y1="222" x2="384"  y2="246"/>
    <line x1="600"  y1="224" x2="600"  y2="246"/>
    <line x1="816"  y1="222" x2="816"  y2="246"/>
    <line x1="1032" y1="224" x2="1032" y2="246"/>
  </g>

  <!-- DETAIL CARDS — equal-width, no overflow -->
  <g font-family="-apple-system, sans-serif" text-anchor="middle">

    <!-- 1. FOUNDATION -->
    <g>
      <text x="168" y="268" font-size="13" font-weight="700" fill="#0f172a">Software Engineer</text>
      <text x="168" y="285" font-size="13" font-weight="700" fill="#0f172a">&#8594; Solution Architect</text>
      <text x="168" y="308" font-size="11" fill="#334155">The Digital Group  &#8226;  QuinStreet</text>
      <text x="168" y="324" font-size="11" fill="#334155">Cognizant</text>
      <text x="168" y="346" font-size="10" fill="#2563eb" font-weight="600">Wolters Kluwer  &#8226;  JPMorgan Chase</text>
    </g>

    <!-- 2. ATOS ARCHITECT -->
    <g>
      <text x="384" y="268" font-size="13" font-weight="700" fill="#0f172a">Tech Solutions</text>
      <text x="384" y="285" font-size="13" font-weight="700" fill="#0f172a">Architect</text>
      <text x="384" y="308" font-size="11" fill="#334155">Atos</text>
      <text x="384" y="346" font-size="10" fill="#9333ea" font-weight="600">Renault  &#8226;  Renault-Nissan Alliance</text>
    </g>

    <!-- 3. EVIDEN ACCOUNT CTO -->
    <g>
      <text x="600" y="268" font-size="13" font-weight="700" fill="#0f172a">Account CTO</text>
      <text x="600" y="285" font-size="13" font-weight="700" fill="#0f172a">Architect, DevOps &amp; Cloud</text>
      <text x="600" y="308" font-size="11" fill="#334155">Eviden  (Atos Group)</text>
      <text x="600" y="346" font-size="10" fill="#0891b2" font-weight="600">Renault  &#8226;  Stellantis</text>
    </g>

    <!-- 4. ATOS DEPUTY CMO -->
    <g>
      <text x="816" y="268" font-size="13" font-weight="700" fill="#0f172a">Deputy Chief</text>
      <text x="816" y="285" font-size="13" font-weight="700" fill="#0f172a">Modernization Officer</text>
      <text x="816" y="308" font-size="11" fill="#334155">Atos</text>
      <text x="816" y="346" font-size="10" fill="#ea580c" font-weight="600">Renault  &#8226;  Stellantis</text>
    </g>

    <!-- 5. KONECTA PRINCIPAL -->
    <g>
      <text x="1032" y="268" font-size="13" font-weight="700" fill="#0f172a">Principal</text>
      <text x="1032" y="285" font-size="13" font-weight="700" fill="#0f172a">Cloud Architect</text>
      <text x="1032" y="308" font-size="11" fill="#334155">Konecta</text>
      <text x="1032" y="346" font-size="10" fill="#16a34a" font-weight="600">LSEG  &#8226;  Investment Banking</text>
    </g>

  </g>

  <!-- Highlight outcome under each card -->
  <g font-family="-apple-system, sans-serif" font-size="9" text-anchor="middle" fill="#94a3b8" font-style="italic">
    <text x="168"  y="378">OvidSP &#8226; FormsOne &#8226; UCard</text>
    <text x="384"  y="378">First Alliance supplier platform</text>
    <text x="600"  y="378">100+ apps to GCP/AWS &#8226; 35% cost cut &#8226; 99.7% uptime</text>
    <text x="816"  y="378">App Modernization &amp; GenAI practice &#8226; 60% faster RFI</text>
    <text x="1032" y="378">AI-led containerization</text>
  </g>

  <!-- Divider -->
  <line x1="60" y1="412" x2="1140" y2="412" stroke="#e2e8f0" stroke-width="1"/>

  <!-- BOTTOM STAT STRIP -->
  <g font-family="-apple-system, sans-serif">
    <g transform="translate(60, 458)">
      <text x="0" y="0" font-size="32" font-weight="800" fill="#2563eb">18+</text>
      <text x="0" y="22" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1.5">YEARS</text>
    </g>
    <g transform="translate(195, 458)">
      <text x="0" y="0" font-size="32" font-weight="800" fill="#16a34a">100+</text>
      <text x="0" y="22" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1.5">APPS MIGRATED</text>
    </g>
    <g transform="translate(360, 458)">
      <text x="0" y="0" font-size="32" font-weight="800" fill="#ea580c">35%</text>
      <text x="0" y="22" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1.5">COST REDUCTION</text>
    </g>
    <g transform="translate(515, 458)">
      <text x="0" y="0" font-size="32" font-weight="800" fill="#9333ea">5&#215;</text>
      <text x="0" y="22" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1.5">GCP CERTIFIED</text>
    </g>
    <g transform="translate(660, 458)">
      <text x="0" y="0" font-size="32" font-weight="800" fill="#0891b2">20+</text>
      <text x="0" y="22" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1.5">ENGINEERS LED</text>
    </g>
    <g transform="translate(815, 458)">
      <text x="0" y="0" font-size="32" font-weight="800" fill="#dc2626">3</text>
      <text x="0" y="22" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1.5">CONTINENTS</text>
    </g>
    <g transform="translate(905, 458)">
      <text x="0" y="0" font-size="32" font-weight="800" fill="#0f172a">99.7%</text>
      <text x="0" y="22" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1.5">UPTIME</text>
    </g>
    <g transform="translate(1055, 458)">
      <text x="0" y="0" font-size="32" font-weight="800" fill="#2563eb">60%</text>
      <text x="0" y="22" font-size="9" font-weight="700" fill="#64748b" letter-spacing="1.5">FASTER RFI</text>
    </g>
  </g>

  <!-- Bottom accent stripe -->
  <rect x="0" y="536" width="1200" height="4" fill="url(#flow)"/>
</svg>
