<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-label="Dipak Kumar Singh — Principal Cloud Architect">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1b26"/>
      <stop offset="55%" stop-color="#1f2335"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#bb9af7"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#c0caf5" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#dots)"/>

  <!-- left accent bar -->
  <rect x="64" y="56" width="3" height="148" fill="url(#accent)"/>

  <!-- Name -->
  <text x="92" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="44" font-weight="700" letter-spacing="0.5" fill="#c0caf5">
    DIPAK KUMAR SINGH
  </text>

  <!-- Title -->
  <text x="92" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="22" font-weight="500" fill="#7aa2f7">
    Principal Cloud Architect
  </text>

  <!-- Tagline -->
  <text x="92" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif"
        font-size="15" font-weight="400" fill="#a9b1d6">
    18+ years  ·  Google Cloud  ·  AWS  ·  Generative AI  ·  Enterprise Modernization
  </text>

  <!-- Right-side decorative cloud + nodes (architecture motif) -->
  <g transform="translate(900, 75)" stroke="#7aa2f7" stroke-width="1.6" fill="none" opacity="0.55">
    <!-- cloud silhouette -->
    <path d="M40 60 a20 20 0 0 1 4 -38 a30 30 0 0 1 56 8 a20 20 0 0 1 0 40 z" stroke-linejoin="round"/>
    <!-- connecting lines to nodes -->
    <line x1="60" y1="70" x2="40" y2="120"/>
    <line x1="80" y1="75" x2="100" y2="120"/>
    <line x1="70" y1="80" x2="70" y2="118"/>
    <!-- nodes -->
    <circle cx="40" cy="124" r="6" fill="#7aa2f7" fill-opacity="0.3"/>
    <circle cx="70" cy="124" r="6" fill="#bb9af7" fill-opacity="0.3"/>
    <circle cx="100" cy="124" r="6" fill="#7dcfff" fill-opacity="0.3"/>
  </g>

  <!-- bottom accent stripe -->
  <rect x="0" y="256" width="1200" height="4" fill="url(#accent)"/>
</svg>
